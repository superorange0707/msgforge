name: CI

# Started by hand only. Checks run on the developer's machine before a merge;
# a push or a pull request never starts a hosted run.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew test
